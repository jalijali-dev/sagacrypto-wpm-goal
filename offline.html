<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sedang Offline — Sagagoal</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0618;
    color: #f5f3ff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .offline-box { max-width: 420px; }
  .offline-box h1 { font-size: 22px; margin: 0 0 12px; }
  .offline-box p { color: #c4bfe0; line-height: 1.6; margin: 0 0 20px; }
  .offline-box button {
    background: #fb923c;
    color: #1a1025;
    border: none;
    border-radius: 10px;
    padding: 12px 22px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="offline-box">
    <h1>Kamu sedang offline</h1>
    <p>Halaman ini belum pernah dibuka sebelumnya, jadi belum tersimpan buat dibaca offline. Cek koneksi internet kamu dan coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
